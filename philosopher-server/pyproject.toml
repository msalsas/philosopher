[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "philosopher-server"
version = "0.1.0"
description = "Conversational AI server with personality, memory, and emotional awareness"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "faster-whisper>=1.0.0",
    "onnxruntime>=1.17.0",
    "face-recognition>=1.3.0",
    # face_recognition's model blobs aren't always auto-pulled, and the stale
    # wrapper imports pkg_resources, which setuptools>=81 removed. Pin both so a
    # fresh install works on modern toolchains. See HARDWARE_RUNBOOK (Trixie note).
    "face_recognition_models>=0.3.0",
    "setuptools<81",
    "opencv-python-headless>=4.9.0",  # headless: server is display-less, avoids the libGL dep
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]
# TTS engine is selectable via PHILOSOPHER_TTS_PROVIDER (piper|kokoro|edge).
# Piper (default) is a system binary, not a pip package -- install it separately
# (see HARDWARE_RUNBOOK). These extras add the optional neural backends:
#   kokoro -> local/offline, natural, needs system espeak-ng + the model files
#             (scripts/download_models.py fetches kokoro-v1.0.onnx + voices).
#   edge   -> Microsoft online neural voices, needs system ffmpeg + internet.
tts-kokoro = ["kokoro-onnx>=0.4.0", "soundfile>=0.12.0"]
tts-edge = ["edge-tts>=6.1.0"]

[project.scripts]
philosopher-server = "philosopher.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["philosopher*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM", "PTH"]
