[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "philosopher-toy"
version = "0.1.0"
description = "Smart toy client - camera, microphone, and servos for Philosopher"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",  # headless: Banana Pi has no display, avoids the libGL dep
    "python-dotenv>=1.0.0",
    # Audio I/O is done via the `arecord`/`aplay` binaries (alsa-utils), not a
    # Python lib — PyAudio's device enumeration hangs the 512 MB Banana Pi.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]
all = ["philosopher-toy[dev]"]

[project.scripts]
philosopher-toy = "banana_client.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["banana_client*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
